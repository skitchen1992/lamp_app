services:
  auth-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.auth_service.app.main
    environment:
      AUTH_DATABASE_HOST: auth-db
      AUTH_DATABASE_PORT: "5432"
      AUTH_DATABASE_NAME: ${AUTH_DATABASE_NAME:?Set AUTH_DATABASE_NAME in .env}
      AUTH_DATABASE_USER: ${AUTH_DATABASE_USER:?Set AUTH_DATABASE_USER in .env}
      AUTH_DATABASE_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Set AUTH_DATABASE_PASSWORD in .env}
      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET in .env}
    depends_on:
      auth-db:
        condition: service_healthy
    expose:
      - "8000"

  product-management-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.product_management_service.app.main
    environment:
      PRODUCT_DATABASE_HOST: product-db
      PRODUCT_DATABASE_PORT: "5432"
      PRODUCT_DATABASE_NAME: ${PRODUCT_DATABASE_NAME:?Set PRODUCT_DATABASE_NAME in .env}
      PRODUCT_DATABASE_USER: ${PRODUCT_DATABASE_USER:?Set PRODUCT_DATABASE_USER in .env}
      PRODUCT_DATABASE_PASSWORD: ${PRODUCT_DATABASE_PASSWORD:?Set PRODUCT_DATABASE_PASSWORD in .env}
    depends_on:
      product-db:
        condition: service_healthy
    expose:
      - "8000"

  order-management-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.order_management_service.app.main
    environment:
      ORDER_DATABASE_HOST: order-db
      ORDER_DATABASE_PORT: "5432"
      ORDER_DATABASE_NAME: ${ORDER_DATABASE_NAME:?Set ORDER_DATABASE_NAME in .env}
      ORDER_DATABASE_USER: ${ORDER_DATABASE_USER:?Set ORDER_DATABASE_USER in .env}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD:?Set ORDER_DATABASE_PASSWORD in .env}
      ORDER_PRODUCT_SERVICE_URL: http://api-gateway-service:8000
    depends_on:
      order-db:
        condition: service_healthy
    expose:
      - "8000"

  api-gateway-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.api_gateway_service.app.main
    environment:
      GATEWAY_AUTH_SERVICE_URL: http://auth-service:8000
      GATEWAY_PRODUCT_SERVICE_URL: http://product-management-service:8000
      GATEWAY_ORDER_SERVICE_URL: http://order-management-service:8000
      GATEWAY_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?Set AUTH_ACCESS_TOKEN_SECRET in .env}
    depends_on:
      auth-service:
        condition: service_started
      product-management-service:
        condition: service_started
      order-management-service:
        condition: service_started
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_SERVICE_PORT:-8000}:8000"

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AUTH_DATABASE_NAME:?Set AUTH_DATABASE_NAME in .env}
      POSTGRES_USER: ${AUTH_DATABASE_USER:?Set AUTH_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${AUTH_DATABASE_PASSWORD:?Set AUTH_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${AUTH_DATABASE_HOST_PORT:-5435}:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PRODUCT_DATABASE_NAME:?Set PRODUCT_DATABASE_NAME in .env}
      POSTGRES_USER: ${PRODUCT_DATABASE_USER:?Set PRODUCT_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${PRODUCT_DATABASE_PASSWORD:?Set PRODUCT_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${PRODUCT_DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_DATABASE_NAME:?Set ORDER_DATABASE_NAME in .env}
      POSTGRES_USER: ${ORDER_DATABASE_USER:?Set ORDER_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${ORDER_DATABASE_PASSWORD:?Set ORDER_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${ORDER_DATABASE_HOST_PORT:-5434}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data

volumes:
  auth_db_data:
  product_db_data:
  order_db_data:
