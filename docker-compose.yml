services:
  product-management-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.product_management_service.app.main
    environment:
      PRODUCT_DATABASE_HOST: product-db
      PRODUCT_DATABASE_PORT: "5432"
      PRODUCT_DATABASE_NAME: ${PRODUCT_DATABASE_NAME:?Set PRODUCT_DATABASE_NAME in .env}
      PRODUCT_DATABASE_USER: ${PRODUCT_DATABASE_USER:?Set PRODUCT_DATABASE_USER in .env}
      PRODUCT_DATABASE_PASSWORD: ${PRODUCT_DATABASE_PASSWORD:?Set PRODUCT_DATABASE_PASSWORD in .env}
    depends_on:
      product-db:
        condition: service_healthy
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${PRODUCT_SERVICE_PORT:-8001}:8000"

  order-management-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.order_management_service.app.main
    environment:
      ORDER_DATABASE_HOST: order-db
      ORDER_DATABASE_PORT: "5432"
      ORDER_DATABASE_NAME: ${ORDER_DATABASE_NAME:?Set ORDER_DATABASE_NAME in .env}
      ORDER_DATABASE_USER: ${ORDER_DATABASE_USER:?Set ORDER_DATABASE_USER in .env}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD:?Set ORDER_DATABASE_PASSWORD in .env}
      ORDER_PRODUCT_SERVICE_URL: http://product-management-service:8000
    depends_on:
      order-db:
        condition: service_healthy
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${ORDER_SERVICE_PORT:-8002}:8000"

  admin-panel-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.admin_panel_service.app.main
    environment:
      ADMIN_DATABASE_HOST: admin-db
      ADMIN_DATABASE_PORT: "5432"
      ADMIN_DATABASE_NAME: ${ADMIN_DATABASE_NAME:?Set ADMIN_DATABASE_NAME in .env}
      ADMIN_DATABASE_USER: ${ADMIN_DATABASE_USER:?Set ADMIN_DATABASE_USER in .env}
      ADMIN_DATABASE_PASSWORD: ${ADMIN_DATABASE_PASSWORD:?Set ADMIN_DATABASE_PASSWORD in .env}
    depends_on:
      admin-db:
        condition: service_healthy
    ports:
      - "${SERVICE_BIND_ADDRESS:-127.0.0.1}:${ADMIN_SERVICE_PORT:-8003}:8000"

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PRODUCT_DATABASE_NAME:?Set PRODUCT_DATABASE_NAME in .env}
      POSTGRES_USER: ${PRODUCT_DATABASE_USER:?Set PRODUCT_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${PRODUCT_DATABASE_PASSWORD:?Set PRODUCT_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${PRODUCT_DATABASE_HOST_PORT:-5433}:5432"
    volumes:
      - product_db_data:/var/lib/postgresql/data

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ORDER_DATABASE_NAME:?Set ORDER_DATABASE_NAME in .env}
      POSTGRES_USER: ${ORDER_DATABASE_USER:?Set ORDER_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${ORDER_DATABASE_PASSWORD:?Set ORDER_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${ORDER_DATABASE_HOST_PORT:-5434}:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data

  admin-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ADMIN_DATABASE_NAME:?Set ADMIN_DATABASE_NAME in .env}
      POSTGRES_USER: ${ADMIN_DATABASE_USER:?Set ADMIN_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${ADMIN_DATABASE_PASSWORD:?Set ADMIN_DATABASE_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${DATABASE_BIND_ADDRESS:-127.0.0.1}:${ADMIN_DATABASE_HOST_PORT:-5435}:5432"
    volumes:
      - admin_db_data:/var/lib/postgresql/data

volumes:
  product_db_data:
  order_db_data:
  admin_db_data:
